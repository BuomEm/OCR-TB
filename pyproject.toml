[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-tb"
version = "1.0.0"
description = "OCR-TB: giải captcha OCR (ddddocr / PP-OCR / Tesseract) kèm HTTP server và bộ benchmark"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "TrackingBot tools" }]
keywords = ["ocr", "captcha", "ddddocr", "ppocr", "tesseract", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

# opencv-python-headless: không cần libGL, chạy được trên container Alpine/Debian slim.
# rapidocr-onnxruntime khai báo opencv-python; headless cài kèm cung cấp đúng module `cv2`.
dependencies = [
  "ddddocr>=1.6,<2",
  "onnxruntime>=1.16",
  "rapidocr-onnxruntime>=1.2,<2",
  "pytesseract>=0.3.10",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "pillow>=10",
  "pyyaml>=6",
  "requests>=2.31",
  "psutil>=5.9",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
ocr-tb = "ocr_tb.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]