[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-tb"
version = "1.0.0"
description = "OCR-TB: giai captcha OCR (ddddocr / PP-OCR / Tesseract) kèm HTTP server và bộ benchmark"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "BuomEm", email = "bluevn26275260@gmail.com" }]
maintainers = [{ name = "BuomEm", email = "bluevn26275260@gmail.com" }]
keywords = [
  "ocr",
  "captcha",
  "ddddocr",
  "ppocr",
  "paddleocr",
  "tesseract",
  "benchmark",
  "fastapi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Vietnamese",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Software Development :: Testing",
]

# opencv-python-headless: không cần libGL trên server/container.
# rapidocr-onnxruntime khai báo opencv-python; headless cung cấp đúng module `cv2`.
dependencies = [
  "ddddocr>=1.6,<2",
  "onnxruntime>=1.16",
  "rapidocr-onnxruntime>=1.2,<2",
  "pytesseract>=0.3.10",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "pillow>=10",
  "pyyaml>=6",
  "requests>=2.31",
  "psutil>=5.9",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/BuomEm/OCR-TB"
Repository = "https://github.com/BuomEm/OCR-TB"
Issues = "https://github.com/BuomEm/OCR-TB/issues"
Changelog = "https://github.com/BuomEm/OCR-TB/blob/main/CHANGELOG.md"

[project.scripts]
ocr-tb = "ocr_tb.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]