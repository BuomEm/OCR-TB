name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag cần phát hành, ví dụ v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Kiểm tra trước khi phát hành
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0

      - name: Cài OCR-TB
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,dev]"

      - name: Chạy test
        run: python -m pytest tests -q

      - name: Kiểm tra version khớp tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(python -c "from ocr_tb.update import current_version; print(current_version())")
          echo "tag=$TAG version=$VERSION"
          test "${TAG#v}" = "$VERSION" || { echo "Tag không khớp version trong pyproject.toml"; exit 1; }

      - name: Ruff (nếu có)
        continue-on-error: true
        run: ruff check src tests

  build:
    name: Build và phát hành
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Đính kèm artifact vào GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          NOTES=$(awk '/^## \[/{exit} {print}' CHANGELOG.md)
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --title "$TAG" \
            --notes "${NOTES:-Bản phát hành $TAG}"
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz --clobber || true

      - name: Phát hành lên PyPI
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m pip install twine && python -m twine upload dist/*

      - name: Bỏ qua PyPI (chưa cấu hình token)
        if: ${{ secrets.PYPI_API_TOKEN == '' }}
        run: echo "Chưa có secret PYPI_API_TOKEN — bỏ qua phát hành PyPI."