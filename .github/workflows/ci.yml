name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Cài thư viện hệ thống (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0

      - name: Cài Tesseract (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract
          echo "TESSDATA_PREFIX=$(brew --prefix)/share/tessdata" >> "$GITHUB_ENV"

      - name: Cài Tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install -y tesseract

      - name: Cài OCR-TB
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,dev]"

      - name: Chạy test
        run: python -m pytest tests -q

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ocr-tb:ci .
      - name: Smoke test server
        run: |
          docker run -d --name ocr -p 2424:2424 ocr-tb:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:2424/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:2424/health
          curl -fsS -X POST -F "file=@samples/01.jpg" -F "expect_length=4" \
            http://127.0.0.1:2424/solve/upload
          docker logs ocr
          docker rm -f ocr