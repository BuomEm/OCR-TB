# Tự động cập nhật dependency và action.
# Xem https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "bot"
    commit-message:
      prefix: "deps"
    groups:
      # Gom patch nhỏ lại 1 PR để ít noise
      patch-updates:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "bot"
    allow:
      - dependency-name: "*"
        dependency-type: "direct"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "bot"
    commit-message:
      prefix: "ci"